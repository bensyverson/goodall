<p>A <a href="https://example.com">plain link</a> and one <a href="https://example.com/x" title="The title">with a title</a>.</p>
<p>An <a href="HTTPS://EXAMPLE.COM">uppercase scheme</a> is linked, and its case is preserved.</p>
<p>A relative link, a scheme-less one and a mailto link are not linked.</p>
<p>Link text is parsed: <a href="https://example.com">a <strong>bold</strong> link</a>.</p>
<p>An unclosed [bracket stays literal.</p>
